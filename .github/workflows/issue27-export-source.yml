name: Issue 27 export source

on:
  push:
    branches:
      - codex/issue-27-m1-closure
    paths:
      - .github/workflows/issue27-export-source.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-27-m1-closure
          fetch-depth: 0
          submodules: recursive
      - uses: actions/upload-artifact@v4
        with:
          name: bb-agent-issue27-source
          path: .
          include-hidden-files: true
          if-no-files-found: error
      - name: Self-clean exporter
        shell: bash
        run: |
          rm -f .github/workflows/issue27-export-source.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/issue27-export-source.yml
          git commit -m "Clean temporary #27 source exporter"
          git push origin HEAD:codex/issue-27-m1-closure
