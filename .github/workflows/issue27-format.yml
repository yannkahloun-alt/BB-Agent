name: Issue 27 formatter

on:
  push:
    branches:
      - codex/issue-27-m1-closure
    paths:
      - .github/workflows/issue27-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-27-m1-closure
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format tests/test_m1_closure.py tools/benchmark_m1.py
      - name: Commit format and self-clean
        shell: bash
        run: |
          rm -f .github/workflows/issue27-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_m1_closure.py tools/benchmark_m1.py .github/workflows/issue27-format.yml
          git commit -m "Format #27 closure validation"
          git push origin HEAD:codex/issue-27-m1-closure
