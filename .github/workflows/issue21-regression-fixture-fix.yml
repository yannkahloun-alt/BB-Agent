name: Issue 21 regression fixture fix

on:
  push:
    branches: [codex/issue-21-evaluator]
    paths:
      - tools/issue21_regression_fixture_fix.py
      - .github/workflows/issue21-regression-fixture-fix.yml

permissions:
  contents: write

env:
  PYTHONHASHSEED: "0"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-21-evaluator
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - name: Correct regression fixtures
        run: python tools/issue21_regression_fixture_fix.py
      - name: Canonicalize test file
        run: |
          python -m ruff format tests/test_evaluator.py
          python -m ruff check --fix tests/test_evaluator.py
      - name: Remove temporary fixer
        run: rm tools/issue21_regression_fixture_fix.py .github/workflows/issue21-regression-fixture-fix.yml
      - name: Commit fixture fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix #21 uncertainty regression fixtures"
          git push origin HEAD:codex/issue-21-evaluator
