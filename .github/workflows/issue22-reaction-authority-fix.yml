name: Issue 22 reaction authority fix

on:
  push:
    branches: [codex/issue-22-decision-trace]
    paths:
      - .github/workflows/issue22-reaction-authority-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-22-decision-trace
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_workflow_dependency.py
      - run: python tools/issue22_reaction_authority_fix.py
      - name: Commit and self-clean
        run: |
          rm tools/issue22_reaction_authority_fix.py
          rm .github/workflows/issue22-reaction-authority-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/bb_agent/tactical_state.py tests/test_trace.py docs/TRACE.md tools/issue22_reaction_authority_fix.py .github/workflows/issue22-reaction-authority-fix.yml
          git commit -m "Exclude contingent reaction authority from semantic identity"
          git push origin HEAD:codex/issue-22-decision-trace
