name: Issue 24 flank exploration

on:
  push:
    branches: [codex/issue-24-core-safety-corpus]

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-24-core-safety-corpus
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - run: python tools/issue24_explore_flank.py
      - name: Self-clean exploration
        run: |
          rm tools/issue24_explore_flank.py
          rm .github/workflows/issue24-explore-flank.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/issue24_explore_flank.py .github/workflows/issue24-explore-flank.yml
          git commit -m "Clean temporary #24 flank exploration"
          git push origin HEAD:codex/issue-24-core-safety-corpus
