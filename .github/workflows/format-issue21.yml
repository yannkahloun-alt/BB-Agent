name: Format issue 21

on:
  push:
    branches:
      - codex/issue-21-evaluator

permissions:
  contents: write

env:
  PYTHONHASHSEED: "0"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-21-evaluator
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - name: Apply pinned Ruff formatter
        run: python -m ruff format src/bb_agent/evaluator.py tests/test_evaluator.py
      - name: Remove temporary formatting machinery
        run: rm .github/workflows/format-issue21.yml tests/test_format_probe.py
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bb_agent/evaluator.py tests/test_evaluator.py .github/workflows/format-issue21.yml tests/test_format_probe.py
          git commit -m "Apply canonical Ruff formatting for #21"
          git push origin HEAD:codex/issue-21-evaluator
