name: Issue 22 reconcile issue 40

on:
  push:
    branches: [codex/issue-22-decision-trace]
    paths:
      - .github/workflows/issue22-reconcile-issue40.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-22-decision-trace
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - run: python tools/issue22_reconcile_issue40.py
      - run: python -m ruff format tests/test_trace.py
      - run: python -m ruff check --fix tests/test_trace.py
      - run: python -m pytest tests/test_candidate_hardening.py tests/test_trace.py
      - name: Commit and self-clean
        run: |
          rm tools/issue22_reconcile_issue40.py
          rm .github/workflows/issue22-reconcile-issue40.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/bb_agent/tactical_state.py tests/test_trace.py docs/TRACE.md tools/issue22_reconcile_issue40.py .github/workflows/issue22-reconcile-issue40.yml
          git commit -m "Reconcile #22 trace identity with frozen #40 reaction semantics"
          git push origin HEAD:codex/issue-22-decision-trace
