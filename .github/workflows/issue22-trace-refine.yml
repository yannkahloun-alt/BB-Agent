name: Issue 22 trace refine

on:
  push:
    branches: [codex/issue-22-decision-trace]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-22-decision-trace
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - name: Refine trace semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/bb_agent/trace.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from bb_agent.results import Problem, ResultStatus",
              "from bb_agent.results import ErrorCode, Problem, ResultStatus",
          )
          text = text.replace(
              '        "outcome_model_versions": outcome_versions,\n',
              '        "declared_outcome_model_version": CURRENT_VERSIONS.outcome_model,\n'
              '        "outcome_model_versions": outcome_versions,\n',
          )
          old_generation = '''        "rejected_probe_counts": {},\n        "indeterminate_count": len(problems),\n        "coverage_diagnostics": [_problem_payload(problem) for problem in problems],\n'''
          new_generation = '''        "rejected_probe_counts": {},\n        "diagnostic_problem_count": len(problems),\n        "indeterminate_count": sum(\n            problem.code\n            in (ErrorCode.EVALUATION_UNSUPPORTED, ErrorCode.MECHANICS_UNSUPPORTED)\n            for problem in problems\n        ),\n        "coverage_diagnostics": [_problem_payload(problem) for problem in problems],\n'''
          if old_generation not in text:
              raise SystemExit("generation marker not found")
          text = text.replace(old_generation, new_generation, 1)
          old_replay = '''    replay_input = ReplayInput(\n        fixture_id=str(expected.input.get("fixture_id") or ""),\n        state=state,\n        state_id=state.state_id,\n        information_profile=state.information_profile,\n        ruleset_content_fingerprint=state.ruleset.content_fingerprint,\n    )\n    revision_value = expected.engine.get("implementation_revision")\n'''
          new_replay = '''    fixture_value = expected.input.get("fixture_id")\n    replay_source: ReplayInput | TacticalState\n    if fixture_value is None:\n        replay_source = state\n    else:\n        replay_source = ReplayInput(\n            fixture_id=str(fixture_value),\n            state=state,\n            state_id=state.state_id,\n            information_profile=state.information_profile,\n            ruleset_content_fingerprint=state.ruleset.content_fingerprint,\n        )\n    revision_value = expected.engine.get("implementation_revision")\n'''
          if old_replay not in text:
              raise SystemExit("replay marker not found")
          text = text.replace(old_replay, new_replay, 1)
          text = text.replace(
              "        replay_input,\n        profile,\n",
              "        replay_source,\n        profile,\n",
              1,
          )
          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_trace.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              "    state = _scenario_flip_state(authority)\n    baseline = EvaluationProfile(\n",
              "    state = _scenario_flip_state(authority, omniscient_hp=20)\n"
              "    baseline = EvaluationProfile(\n",
              1,
          )
          test_path.write_text(tests, encoding="utf-8")
          PY
      - name: Canonicalize edited Python
        run: python -m ruff format src/bb_agent/trace.py tests/test_trace.py src/bb_agent/__init__.py
      - name: Remove temporary helper
        run: rm .github/workflows/issue22-trace-refine.yml
      - name: Commit refinements
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/bb_agent/trace.py tests/test_trace.py src/bb_agent/__init__.py .github/workflows/issue22-trace-refine.yml
          git commit -m "Refine #22 trace identity and diagnostics"
          git push origin HEAD:codex/issue-22-decision-trace
