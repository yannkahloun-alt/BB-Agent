name: Issue 25 builder diagnostic patch

on:
  push:
    branches: [codex/issue-25-quality-uncertainty-corpus]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-25-quality-uncertainty-corpus
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/issue25_patch_builder_diagnostics.py
      - name: Commit diagnostic patch and self-clean
        run: |
          rm tools/issue25_patch_builder_diagnostics.py
          rm .github/workflows/issue25-patch-builder.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/issue25_build_corpus.py tools/issue25_patch_builder_diagnostics.py .github/workflows/issue25-patch-builder.yml
          git commit -m "Improve #25 corpus builder diagnostics"
          git push origin HEAD:codex/issue-25-quality-uncertainty-corpus
