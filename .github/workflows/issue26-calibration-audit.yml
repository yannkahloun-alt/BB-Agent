name: Issue 26 calibration audit

on:
  push:
    branches:
      - codex/issue-26-evaluator-calibration

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-26-evaluator-calibration
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - run: python tools/issue26_calibration_audit.py
      - name: Self-clean audit helpers
        if: always()
        run: |
          rm -f tools/issue26_calibration_audit.py .github/workflows/issue26-calibration-audit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/issue26_calibration_audit.py .github/workflows/issue26-calibration-audit.yml
          if ! git diff --cached --quiet; then
            git commit -m "Clean temporary #26 calibration audit"
            git push origin HEAD:codex/issue-26-evaluator-calibration
          fi
