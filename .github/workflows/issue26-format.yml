name: Issue 26 formatter

on:
  push:
    branches:
      - codex/issue-26-evaluator-calibration

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-26-evaluator-calibration
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format tests/test_calibration.py
      - name: Commit format and self-clean
        run: |
          rm .github/workflows/issue26-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_calibration.py .github/workflows/issue26-format.yml
          git commit -m "Format #26 calibration test"
          git push origin HEAD:codex/issue-26-evaluator-calibration
