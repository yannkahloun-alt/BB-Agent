name: Issue 24 adversarial review fixes

on:
  push:
    branches: [codex/issue-24-core-safety-corpus]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-24-core-safety-corpus
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - run: python tools/issue24_adversarial_fix.py
      - name: Commit fixture fixes and self-clean
        run: |
          rm tools/issue24_adversarial_fix.py
          rm .github/workflows/issue24-adversarial-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/fixtures/ticket_24 tools/issue24_adversarial_fix.py .github/workflows/issue24-adversarial-fix.yml
          git commit -m "Fix #24 adversarial review findings"
          git push origin HEAD:codex/issue-24-core-safety-corpus
