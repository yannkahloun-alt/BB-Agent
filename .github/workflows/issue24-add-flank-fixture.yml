name: Issue 24 flank fixture builder

on:
  push:
    branches: [codex/issue-24-core-safety-corpus]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-24-core-safety-corpus
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - run: python tools/issue24_add_flank_fixture.py
      - name: Commit fixture and self-clean
        run: |
          rm tools/issue24_add_flank_fixture.py
          rm .github/workflows/issue24-add-flank-fixture.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/fixtures/ticket_24/t24-safety-high-damage-vs-protect-flank.json tools/issue24_add_flank_fixture.py .github/workflows/issue24-add-flank-fixture.yml
          git commit -m "Add #24 high-damage flank safety fixture"
          git push origin HEAD:codex/issue-24-core-safety-corpus
