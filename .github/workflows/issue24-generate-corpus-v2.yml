name: Issue 24 corpus generation v2

on:
  push:
    branches: [codex/issue-24-core-safety-corpus]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-24-core-safety-corpus
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - run: python tools/issue24_refine_generator.py
      - run: python tools/issue24_generate_corpus.py
      - run: python -m ruff format tools/issue24_generate_corpus.py tools/issue24_refine_generator.py
      - run: python -m ruff check --fix tools/issue24_generate_corpus.py tools/issue24_refine_generator.py
      - run: python -m ruff format tools/issue24_generate_corpus.py tools/issue24_refine_generator.py
      - run: python -m ruff check tools/issue24_generate_corpus.py tools/issue24_refine_generator.py
      - name: Commit generated fixtures and self-clean
        run: |
          rm tools/issue24_generate_corpus.py
          rm tools/issue24_refine_generator.py
          rm .github/workflows/issue24-generate-corpus.yml
          rm .github/workflows/issue24-generate-corpus-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/fixtures/ticket_24 tools/issue24_generate_corpus.py tools/issue24_refine_generator.py .github/workflows/issue24-generate-corpus.yml .github/workflows/issue24-generate-corpus-v2.yml
          git commit -m "Add #24 core and safety fixture corpus"
          git push origin HEAD:codex/issue-24-core-safety-corpus
