name: Issue 22 CI fix

on:
  push:
    branches: [codex/issue-22-decision-trace]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-22-decision-trace
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - name: Correct trace diff regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_trace.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def test_trace_diff_reports_component_and_rank_deltas():")
          replacement = '''def test_trace_diff_reports_component_and_rank_deltas():\n    authority = _authority()\n    before_state = _scenario_flip_state(authority, omniscient_hp=5)\n    after_state = _scenario_flip_state(authority, omniscient_hp=20)\n    profile = EvaluationProfile(\n        weights=replace(\n            DEFAULT_EVALUATION_PROFILE.weights,\n            enemy_effect=1.0,\n            post_action_exposure=0.0,\n            position_control_protection=0.0,\n            resource_future_capacity=0.0,\n            tempo=0.0,\n        ),\n        tail_risk_weight=0.0,\n        uncertainty_weight=0.0,\n        near_tie_margin=0.001,\n    )\n\n    before = run_decision_trace(authority, before_state, profile)\n    after = run_decision_trace(authority, after_state, profile)\n    diff = compare_traces(before, after)\n\n    assert diff.output_fingerprint_changed is True\n    assert diff.chosen_action_changed is True\n    assert diff.rank_deltas\n    assert diff.component_deltas\n    assert any(delta.component_id == "enemy_effect" for delta in diff.component_deltas)\n'''
          text = text[:start] + replacement
          path.write_text(text, encoding="utf-8")
          PY
      - name: Apply pinned Ruff fixes
        run: |
          python -m ruff check --fix src/bb_agent/trace.py src/bb_agent/__init__.py tests/test_trace.py
          python -m ruff format src/bb_agent/trace.py src/bb_agent/__init__.py tests/test_trace.py
      - name: Remove temporary helper
        run: rm .github/workflows/issue22-ci-fix.yml
      - name: Commit CI fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/bb_agent/trace.py src/bb_agent/__init__.py tests/test_trace.py .github/workflows/issue22-ci-fix.yml
          git commit -m "Fix #22 trace CI regressions"
          git push origin HEAD:codex/issue-22-decision-trace
