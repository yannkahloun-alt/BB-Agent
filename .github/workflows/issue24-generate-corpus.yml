name: Issue 24 corpus generation

on:
  push:
    branches: [codex/issue-24-core-safety-corpus]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-24-core-safety-corpus
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - name: Refine formation expectation
        run: python -c 'from pathlib import Path; p=Path("tools/issue24_generate_corpus.py"); s=p.read_text(); b="                    \\\"required_explanations\\\": [\\n                        {\\\"action_id\\\": move.action_id, \\\"component_ids\\\": [\\\"position_control_protection\\\"]}\\n                    ],\\n"; assert b in s; p.write_text(s.replace(b, "", 1))'
      - run: python tools/issue24_generate_corpus.py
      - run: python -m ruff check tools/issue24_generate_corpus.py
      - name: Commit generated fixtures and self-clean
        run: |
          rm tools/issue24_generate_corpus.py
          rm .github/workflows/issue24-generate-corpus.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/fixtures/ticket_24 tools/issue24_generate_corpus.py .github/workflows/issue24-generate-corpus.yml
          git commit -m "Add #24 core and safety fixture corpus"
          git push origin HEAD:codex/issue-24-core-safety-corpus
