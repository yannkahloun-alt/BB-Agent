name: Issue 25 corpus builder

on:
  push:
    branches: [codex/issue-25-quality-uncertainty-corpus]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-25-quality-uncertainty-corpus
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - run: python tools/issue25_build_corpus.py
      - name: Commit corpus and self-clean
        run: |
          rm tools/issue25_build_corpus.py
          rm .github/workflows/issue25-build-corpus.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/fixtures/ticket_25 tools/issue25_build_corpus.py .github/workflows/issue25-build-corpus.yml
          git commit -m "Add #25 quality uncertainty corpus"
          git push origin HEAD:codex/issue-25-quality-uncertainty-corpus
