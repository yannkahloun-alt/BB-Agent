name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  PYTHONHASHSEED: "0"

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format .
      - name: Commit formatter output
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/bb_agent/outcomes.py src/bb_agent/transitions.py tests/test_candidate_hardening.py
            git commit -m "Apply Ruff formatting for #40"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - run: python -m ruff check .

  pyflakes:
    name: pyflakes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - run: python -m pyflakes src tests tools
