name: Issue 23 replay config identity fix

on:
  push:
    branches: [codex/issue-23-validation-harness]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-23-validation-harness
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - name: Preserve replay numeric config identity
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/bb_agent/trace.py")
          text = path.read_text()
          anchor = '''def _string(value: JsonValue, name: str) -> str:
              if not isinstance(value, str) or not value:
                  raise ValueError(f"{name} must be a nonempty string")
              return value
          '''.replace("          ", "")
          helper = '''

          def _number(value: JsonValue, name: str) -> int | float:
              if isinstance(value, bool) or not isinstance(value, int | float):
                  raise ValueError(f"{name} must be numeric")
              return value
          '''.replace("          ", "")
          if anchor not in text:
              raise SystemExit("missing trace string helper anchor")
          if "def _number(value: JsonValue" not in text:
              text = text.replace(anchor, anchor + helper, 1)

          replacements = {
              'field.name: float(weights_data[field.name])': (
                  'field.name: _number(\n'
                  '                weights_data[field.name],\n'
                  '                f"evaluation_profile.weights.{field.name}",\n'
                  '            )'
              ),
              'field.name: float(scales_data[field.name])': (
                  'field.name: _number(\n'
                  '                scales_data[field.name],\n'
                  '                f"evaluation_profile.scales.{field.name}",\n'
                  '            )'
              ),
              'tail_risk_weight=float(profile["tail_risk_weight"]),': (
                  'tail_risk_weight=_number(\n'
                  '            profile["tail_risk_weight"], "evaluation_profile.tail_risk_weight"\n'
                  '        ),'
              ),
              'uncertainty_weight=float(profile["uncertainty_weight"]),': (
                  'uncertainty_weight=_number(\n'
                  '            profile["uncertainty_weight"],\n'
                  '            "evaluation_profile.uncertainty_weight",\n'
                  '        ),'
              ),
              'near_tie_margin=float(profile["near_tie_margin"]),': (
                  'near_tie_margin=_number(\n'
                  '            profile["near_tie_margin"], "evaluation_profile.near_tie_margin"\n'
                  '        ),'
              ),
              'max_self_death_probability=None if threshold is None else float(threshold),': (
                  'max_self_death_probability=(\n'
                  '            None\n'
                  '            if threshold is None\n'
                  '            else _number(\n'
                  '                threshold, "evaluation_profile.max_self_death_probability"\n'
                  '            )\n'
                  '        ),'
              ),
              'actor_values.append((str(pair[0]), float(pair[1])))': (
                  'actor_values.append(\n'
                  '            (\n'
                  '                str(pair[0]),\n'
                  '                _number(pair[1], "unit_value_policy actor value"),\n'
                  '            )\n'
                  '        )'
              ),
              'default_value=float(policy["default_value"]),': (
                  'default_value=_number(\n'
                  '            policy["default_value"], "unit_value_policy.default_value"\n'
                  '        ),'
              ),
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"missing replay config anchor: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)

          doc = Path("docs/VALIDATION.md")
          text = doc.read_text()
          marker = (
              "The corpus report passes only when there are zero blocking failures. There is intentionally no aggregate tactical-accuracy percentage that can hide a failed promoted safety/core assertion.\n"
          )
          note = (
              "\nExact replay preserves the original JSON numeric representation of versioned evaluator/profile and UnitValuePolicy fields (for example `1` remains `1`, rather than being rewritten to `1.0`). This keeps configuration identity byte-stable while leaving numeric scoring semantics unchanged.\n"
          )
          if marker not in text:
              raise SystemExit("missing validation replay documentation anchor")
          if note.strip() not in text:
              text = text.replace(marker, marker + note, 1)
          doc.write_text(text)
          PY
          python -m ruff format src/bb_agent/trace.py
          python -m ruff check src/bb_agent/trace.py tests/test_validation.py
          python -m pytest tests/test_trace.py tests/test_validation.py
      - name: Commit and self-clean
        run: |
          rm .github/workflows/issue23-replay-config-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/bb_agent/trace.py docs/VALIDATION.md .github/workflows/issue23-replay-config-fix.yml
          git commit -m "Preserve numeric config identity during replay"
          git push origin HEAD:codex/issue-23-validation-harness
