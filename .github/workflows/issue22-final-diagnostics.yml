name: Issue 22 final diagnostics

on:
  push:
    branches: [codex/issue-22-decision-trace]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-22-decision-trace
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - name: Preserve precise failure stages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          evaluator_path = Path("src/bb_agent/evaluator.py")
          evaluator = evaluator_path.read_text(encoding="utf-8")
          evaluator = evaluator.replace(
              '''    try:\n        normalized = state.normalized()\n    except (TypeError, ValueError) as exc:\n        record_timing("validation", stage_started)\n        record_counter("validation_problem_count", 1)\n        return Result.validation_failure(\n            Problem(\n                ErrorCode.VALIDATION_FAILED,\n                str(exc),\n                "state",\n            )\n        )\n    record_timing("validation", stage_started)\n\n    stage_started = perf_counter_ns()\n    coverage = authority.classify(normalized)\n    record_timing("coverage", stage_started)\n''',
              '''    try:\n        normalized = state.normalized()\n    except (TypeError, ValueError) as exc:\n        record_timing("validation", stage_started)\n        record_counter("validation_problem_count", 1)\n        return Result.validation_failure(\n            Problem(\n                ErrorCode.VALIDATION_FAILED,\n                str(exc),\n                "state",\n            )\n        )\n    except Exception:\n        record_timing("validation", stage_started)\n        raise\n    record_timing("validation", stage_started)\n\n    stage_started = perf_counter_ns()\n    try:\n        coverage = authority.classify(normalized)\n    finally:\n        record_timing("coverage", stage_started)\n''',
              1,
          )
          old_outcome = '''    for action in actions:\n        stage_started = perf_counter_ns()\n        feature_result = extract_candidate_features(\n            authority,\n            normalized,\n            action.action_id,\n        )\n        if feature_result.value is None:\n            record_timing("outcome_and_features", stage_started)\n            record_counter("evaluated_candidate_count", len(evaluations))\n            return Result(\n                feature_result.status,\n                problems=feature_result.problems,\n            )\n        scenario_result = extract_candidate_feature_scenarios(\n            authority,\n            normalized,\n            action.action_id,\n        )\n        record_timing("outcome_and_features", stage_started)\n        if scenario_result.value is None:\n            record_counter("evaluated_candidate_count", len(evaluations))\n            return Result(\n                scenario_result.status,\n                problems=scenario_result.problems,\n            )\n'''
          new_outcome = '''    for action in actions:\n        stage_started = perf_counter_ns()\n        try:\n            feature_result = extract_candidate_features(\n                authority,\n                normalized,\n                action.action_id,\n            )\n            if feature_result.value is None:\n                record_counter("evaluated_candidate_count", len(evaluations))\n                return Result(\n                    feature_result.status,\n                    problems=feature_result.problems,\n                )\n            scenario_result = extract_candidate_feature_scenarios(\n                authority,\n                normalized,\n                action.action_id,\n            )\n        finally:\n            record_timing("outcome_and_features", stage_started)\n        if scenario_result.value is None:\n            record_counter("evaluated_candidate_count", len(evaluations))\n            return Result(\n                scenario_result.status,\n                problems=scenario_result.problems,\n            )\n'''
          if old_outcome not in evaluator:
              raise SystemExit("outcome timing marker not found")
          evaluator = evaluator.replace(old_outcome, new_outcome, 1)
          evaluator_path.write_text(evaluator, encoding="utf-8")

          trace_path = Path("src/bb_agent/trace.py")
          trace = trace_path.read_text(encoding="utf-8")
          trace = trace.replace(
              '''    return {\n        "action_id": candidate.action_id,\n        "action": action,\n''',
              '''    return {\n        "action_id": candidate.action_id,\n        "coverage_status": "SUPPORTED",\n        "action": action,\n''',
              1,
          )
          stage_marker = '''def _failure_stage(status: ResultStatus, timings: Mapping[str, int]) -> str:\n    if status is ResultStatus.VALIDATION_FAILURE:\n        return "validation"\n    if "outcome_and_features" in timings:\n        return "outcome_and_features"\n    if "coverage" in timings:\n        return "coverage"\n    return "evaluation"\n\n\n'''
          stage_replacement = stage_marker + '''def _exception_stage(timings: Mapping[str, int]) -> str:\n    for stage in (\n        "selection",\n        "scoring",\n        "outcome_and_features",\n        "coverage",\n        "validation",\n    ):\n        if stage in timings:\n            return stage\n    return "evaluation"\n\n\n'''
          if stage_marker not in trace:
              raise SystemExit("failure stage marker not found")
          trace = trace.replace(stage_marker, stage_replacement, 1)
          trace = trace.replace(
              '''        failure = {\n            "stage": "evaluation",\n            "status": "EVALUATION_EXCEPTION",\n''',
              '''        failure = {\n            "stage": _exception_stage(timings),\n            "status": "EVALUATION_EXCEPTION",\n''',
              1,
          )
          trace = trace.replace(
              '''    try:\n        return state.normalized()\n    except (TypeError, ValueError):\n        return None\n''',
              '''    try:\n        return state.normalized()\n    except Exception:\n        return None\n''',
              1,
          )
          trace = trace.replace(
              '''    except (TypeError, ValueError, AssertionError):\n        return {\n''',
              '''    except Exception:\n        return {\n''',
              1,
          )
          trace_path.write_text(trace, encoding="utf-8")

          test_path = Path("tests/test_trace.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              "from bb_agent.evaluator import DEFAULT_EVALUATION_PROFILE, EvaluationProfile\n",
              "from bb_agent.evaluator import (\n"
              "    DEFAULT_EVALUATION_PROFILE,\n"
              "    EvaluationProfile,\n"
              "    evaluate_decision,\n"
              ")\n",
              1,
          )
          tests = tests.replace(
              '''    direct = run_decision_trace(authority, state)\n    timings = direct.performance["stage_timings_ns"]\n''',
              '''    direct_result = evaluate_decision(authority, state)\n    direct = run_decision_trace(authority, state)\n    assert direct_result.status is ResultStatus.SUCCESS\n    assert direct_result.value is not None\n    assert direct.selection is not None\n    assert tuple(direct.selection["ranking"]) == direct_result.value.ranking\n    assert direct.selection["chosen_action_id"] == direct_result.value.chosen_action_id\n    timings = direct.performance["stage_timings_ns"]\n''',
              1,
          )
          tests = tests.replace(
              '''    assert record["action_id"] == trace.selection["chosen_action_id"]\n    assert record["action"] is not None\n''',
              '''    assert record["action_id"] == trace.selection["chosen_action_id"]\n    assert record["coverage_status"] == "SUPPORTED"\n    assert record["action"] is not None\n''',
              1,
          )
          tests = tests.replace(
              '''    assert DecisionTrace.from_json_bytes(trace.to_json_bytes()) == trace\n\n\ndef test_player_legal_and_debug_traces_identify_profile_and_shared_raw_capture():\n''',
              '''    assert DecisionTrace.from_json_bytes(trace.to_json_bytes()) == trace\n    replay = replay_decision_trace(authority, trace)\n    assert replay.matches is True\n\n\ndef test_invalid_state_emits_validation_failure_trace():\n    authority = _authority()\n    state = replace(_ordinary_attack_state(authority), state_id="stale-state-id")\n\n    trace = run_decision_trace(authority, state)\n\n    assert trace.selection is None\n    assert trace.failure is not None\n    assert trace.failure["stage"] == "validation"\n    assert trace.failure["status"] == ResultStatus.VALIDATION_FAILURE.value\n    assert trace.generation["decision_status"] == ResultStatus.VALIDATION_FAILURE.value\n\n\ndef test_player_legal_and_debug_traces_identify_profile_and_shared_raw_capture():\n''',
              1,
          )
          test_path.write_text(tests, encoding="utf-8")
          PY
      - name: Canonicalize edited Python
        run: |
          python -m ruff check --fix src/bb_agent/evaluator.py src/bb_agent/trace.py tests/test_trace.py
          python -m ruff format src/bb_agent/evaluator.py src/bb_agent/trace.py tests/test_trace.py
      - name: Remove temporary helper
        run: rm .github/workflows/issue22-final-diagnostics.yml
      - name: Commit diagnostics refinements
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/bb_agent/evaluator.py src/bb_agent/trace.py tests/test_trace.py .github/workflows/issue22-final-diagnostics.yml
          git commit -m "Harden #22 failure-stage diagnostics"
          git push origin HEAD:codex/issue-22-decision-trace
