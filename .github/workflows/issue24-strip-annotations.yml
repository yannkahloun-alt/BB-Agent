name: Issue 24 annotation sanitizer

on:
  push:
    branches: [codex/issue-24-core-safety-corpus]

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-24-core-safety-corpus
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - run: python tools/issue24_strip_annotations.py
      - run: python -m ruff format tests/test_core_safety_corpus.py
      - run: python -m ruff check tests/test_core_safety_corpus.py
      - run: python -m pytest tests/test_core_safety_corpus.py
      - name: Commit sanitized corpus and self-clean
        run: |
          rm tools/issue24_strip_annotations.py
          rm .github/workflows/issue24-strip-annotations.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/fixtures/ticket_24 tests/test_core_safety_corpus.py tools/issue24_strip_annotations.py .github/workflows/issue24-strip-annotations.yml
          git commit -m "Remove stale #24 fixture annotations"
          git push origin HEAD:codex/issue-24-core-safety-corpus
