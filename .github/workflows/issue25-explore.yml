name: Issue 25 corpus exploration

on:
  push:
    branches: [codex/issue-25-quality-uncertainty-corpus]

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-25-quality-uncertainty-corpus
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - run: python tools/issue25_explore.py
      - name: Self-clean exploration helpers
        run: |
          rm tools/issue25_explore.py
          rm .github/workflows/issue25-explore.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/issue25_explore.py .github/workflows/issue25-explore.yml
          git commit -m "Clean temporary #25 corpus exploration"
          git push origin HEAD:codex/issue-25-quality-uncertainty-corpus
