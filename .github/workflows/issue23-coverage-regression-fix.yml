name: Issue 23 coverage regression fix

on:
  push:
    branches: [codex/issue-23-validation-harness]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-23-validation-harness
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - run: python tools/issue23_coverage_regression_fix.py
      - run: python -m ruff format src/bb_agent/validation.py tests/test_validation.py
      - run: python -m ruff check --fix src/bb_agent/validation.py tests/test_validation.py
      - run: python -m ruff format src/bb_agent/validation.py tests/test_validation.py
      - run: python -m ruff check src/bb_agent/validation.py tests/test_validation.py
      - run: python -m pytest tests/test_validation.py tests/test_trace.py
      - name: Commit and self-clean
        run: |
          rm tools/issue23_coverage_regression_fix.py
          rm .github/workflows/issue23-coverage-regression-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/VALIDATION.md src/bb_agent/validation.py tests/test_validation.py tools/issue23_coverage_regression_fix.py .github/workflows/issue23-coverage-regression-fix.yml
          git commit -m "Fix #23 unexpected coverage regression classification"
          git push origin HEAD:codex/issue-23-validation-harness
