name: Issue 22 semantic identity fix

on:
  push:
    branches:
      - codex/issue-22-decision-trace
    paths:
      - tools/issue22_semantic_fix.py
      - .github/workflows/issue22-semantic-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-22-decision-trace
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - run: python tools/issue22_semantic_fix.py
      - run: python -m ruff format src/bb_agent/trace.py tests/test_trace.py
      - run: python -m ruff check --fix src/bb_agent/trace.py tests/test_trace.py
      - run: python -m pytest tests/test_trace.py
      - name: Commit and self-clean
        run: |
          rm tools/issue22_semantic_fix.py
          rm .github/workflows/issue22-semantic-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/bb_agent/trace.py tests/test_trace.py docs/TRACE.md tools/issue22_semantic_fix.py .github/workflows/issue22-semantic-fix.yml
          git commit -m "Align #22 fingerprint with semantic state identity"
          git push origin HEAD:codex/issue-22-decision-trace
