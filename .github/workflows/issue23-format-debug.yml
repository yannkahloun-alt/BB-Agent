name: Issue 23 format and diagnostics

on:
  push:
    branches: [codex/issue-23-validation-harness]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-23-validation-harness
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - name: Canonicalize and improve failure diagnostics
        run: |
          python -m ruff format src/bb_agent/validation.py tests/test_validation.py
          python - <<'PY'
          from pathlib import Path

          path = Path("src/bb_agent/validation.py")
          text = path.read_text()
          text = text.replace(
              '                "ranking assertions cannot be combined with a non-success expected status"\n',
              '                "ranking assertions cannot be combined with a non-success "\n'
              '                "expected status"\n',
          )
          text = text.replace(
              '                "trace legal candidates exactly match the complete fixture affordance set",\n',
              '                "trace legal candidates exactly match the complete fixture "\n'
              '                "affordance set",\n',
          )
          text = text.replace(
              '                f"decision status is {actual_status!r}; expected {expectations.expected_status!r}",\n',
              '                f"decision status is {actual_status!r}; expected "\n'
              '                f"{expectations.expected_status!r}",\n',
          )
          text = text.replace(
              '                f"legal action IDs are {sorted(legal_ids)}; expected {sorted(expected)}",\n',
              '                f"legal action IDs are {sorted(legal_ids)}; expected "\n'
              '                f"{sorted(expected)}",\n',
          )
          path.write_text(text)

          path = Path("tests/test_validation.py")
          text = path.read_text()
          text = text.replace(
              "assert report.passed is True\n",
              "assert report.passed is True, report.blocking_failures\n",
          )
          path.write_text(text)
          PY
          python -m ruff format src/bb_agent/validation.py tests/test_validation.py
          python -m ruff check --fix src/bb_agent/validation.py tests/test_validation.py
      - name: Commit and self-clean
        run: |
          rm .github/workflows/issue23-format-debug.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/bb_agent/validation.py tests/test_validation.py .github/workflows/issue23-format-debug.yml
          git commit -m "Format #23 harness and improve diagnostics"
          git push origin HEAD:codex/issue-23-validation-harness
