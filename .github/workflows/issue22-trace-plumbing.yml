name: Issue 22 trace plumbing

on:
  push:
    branches: [codex/issue-22-decision-trace]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-22-decision-trace
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - name: Apply trace plumbing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          features_path = Path("src/bb_agent/features.py")
          features = features_path.read_text(encoding="utf-8")
          marker = '''@dataclass(frozen=True, slots=True)\nclass TacticalFeatures:\n'''
          insert = '''@dataclass(frozen=True, slots=True)\nclass OutcomeModelFacts:\n    """Trace-facing facts about the deterministic outcome method used."""\n\n    method: str\n    branch_count: int\n    epistemic_scenario_count: int = 0\n    sample_count: int = 0\n    simulator_seed: str | None = None\n\n    def __post_init__(self) -> None:\n        if not self.method:\n            raise ValueError("outcome method must be nonempty")\n        if self.branch_count < 0 or self.epistemic_scenario_count < 0 or self.sample_count < 0:\n            raise ValueError("outcome diagnostic counts must be nonnegative")\n\n\n@dataclass(frozen=True, slots=True)\nclass TacticalFeatures:\n'''
          if marker not in features:
              raise SystemExit("TacticalFeatures marker not found")
          features = features.replace(marker, insert, 1)
          field_marker = '''    outcome_model_version: str\n    enemy_effect: EnemyEffectFeatures\n'''
          field_replacement = '''    outcome_model_version: str\n    outcome_facts: OutcomeModelFacts\n    enemy_effect: EnemyEffectFeatures\n'''
          if field_marker not in features:
              raise SystemExit("TacticalFeatures field marker not found")
          features = features.replace(field_marker, field_replacement, 1)
          outcome_block = '''    if attack is not None:\n        outcome_model_version = attack.model_version\n    elif transition is not None:\n        outcome_model_version = transition.model_version\n    else:\n        _invalid(action, "tactical features require an outcome model version")\n\n    return TacticalFeatures(\n        action.action_id,\n        MODEL_VERSION,\n        outcome_model_version,\n        _enemy_effect(attack),\n'''
          outcome_replacement = '''    if attack is not None:\n        outcome_model_version = attack.model_version\n        if attack.epistemic_scenarios:\n            branch_count = sum(\n                len(scenario.branches) for scenario in attack.epistemic_scenarios\n            )\n            epistemic_scenario_count = len(attack.epistemic_scenarios)\n        else:\n            branch_count = len(attack.branches)\n            epistemic_scenario_count = 0\n        outcome_facts = OutcomeModelFacts(\n            "exact_branch_enumeration",\n            branch_count,\n            epistemic_scenario_count,\n        )\n    elif transition is not None:\n        outcome_model_version = transition.model_version\n        outcome_facts = OutcomeModelFacts(\n            (\n                "deterministic_transition"\n                if len(transition.branches) == 1\n                else "exact_branch_enumeration"\n            ),\n            len(transition.branches),\n        )\n    else:\n        _invalid(action, "tactical features require an outcome model version")\n\n    return TacticalFeatures(\n        action.action_id,\n        MODEL_VERSION,\n        outcome_model_version,\n        outcome_facts,\n        _enemy_effect(attack),\n'''
          if outcome_block not in features:
              raise SystemExit("outcome block not found")
          features = features.replace(outcome_block, outcome_replacement, 1)
          features_path.write_text(features, encoding="utf-8")

          evaluator_path = Path("src/bb_agent/evaluator.py")
          evaluator = evaluator_path.read_text(encoding="utf-8")
          import_marker = '''import math\nfrom dataclasses import asdict, dataclass, replace\nfrom itertools import product\n'''
          import_replacement = '''import math\nfrom collections.abc import Callable\nfrom dataclasses import asdict, dataclass, replace\nfrom itertools import product\nfrom time import perf_counter_ns\n'''
          if import_marker not in evaluator:
              raise SystemExit("evaluator import marker not found")
          evaluator = evaluator.replace(import_marker, import_replacement, 1)
          constant_marker = '''_TOLERANCE = 1e-9\n\n\n@dataclass(frozen=True, slots=True)\nclass EvaluationWeights:\n'''
          constant_replacement = '''_TOLERANCE = 1e-9\n\nStageTimingSink = Callable[[str, int], None]\nCounterSink = Callable[[str, int], None]\n\n\n@dataclass(frozen=True, slots=True)\nclass EvaluationWeights:\n'''
          if constant_marker not in evaluator:
              raise SystemExit("evaluator constant marker not found")
          evaluator = evaluator.replace(constant_marker, constant_replacement, 1)
          function_start = evaluator.find("def evaluate_decision(\n")
          if function_start < 0:
              raise SystemExit("evaluate_decision not found")
          new_function = '''def evaluate_decision(\n    authority: MechanicsAuthority,\n    state: TacticalState,\n    profile: EvaluationProfile = DEFAULT_EVALUATION_PROFILE,\n    unit_value_policy: UnitValuePolicy = DEFAULT_UNIT_VALUE_POLICY,\n    *,\n    timing_sink: StageTimingSink | None = None,\n    counter_sink: CounterSink | None = None,\n) -> Result[DecisionEvaluation]:\n    """Evaluate the complete canonical current affordance set fail-closed.\n\n    Optional diagnostics sinks observe elapsed stage time and deterministic\n    counters without becoming ranking inputs or part of decision identity.\n    """\n\n    def record_timing(stage: str, started_ns: int) -> None:\n        if timing_sink is not None:\n            timing_sink(stage, perf_counter_ns() - started_ns)\n\n    def record_counter(name: str, value: int) -> None:\n        if counter_sink is not None:\n            counter_sink(name, value)\n\n    stage_started = perf_counter_ns()\n    try:\n        normalized = state.normalized()\n    except (TypeError, ValueError) as exc:\n        record_timing("validation", stage_started)\n        record_counter("validation_problem_count", 1)\n        return Result.validation_failure(\n            Problem(\n                ErrorCode.VALIDATION_FAILED,\n                str(exc),\n                "state",\n            )\n        )\n    record_timing("validation", stage_started)\n\n    stage_started = perf_counter_ns()\n    coverage = authority.classify(normalized)\n    record_timing("coverage", stage_started)\n    record_counter("coverage_problem_count", len(coverage.problems))\n    if coverage.status is not ResultStatus.SUCCESS:\n        return Result(\n            coverage.status,\n            problems=coverage.problems,\n        )\n    if not normalized.action_affordances.actions:\n        record_counter("validation_problem_count", 1)\n        return Result.validation_failure(\n            Problem(\n                ErrorCode.VALIDATION_FAILED,\n                "complete affordance set contains no current actions",\n                "action_affordances.actions",\n            )\n        )\n\n    evaluations = []\n    scenario_features: dict[str, tuple[EpistemicFeatureScenario, ...]] = {}\n    scenario_evaluations: dict[\n        str,\n        tuple[tuple[tuple[EpistemicAssignment, ...], CandidateEvaluation], ...],\n    ] = {}\n    actions = sorted(\n        normalized.action_affordances.actions,\n        key=lambda candidate: candidate.action_id,\n    )\n    record_counter("legal_candidate_count", len(actions))\n    epistemic_input_scenarios = 0\n    for action in actions:\n        stage_started = perf_counter_ns()\n        feature_result = extract_candidate_features(\n            authority,\n            normalized,\n            action.action_id,\n        )\n        if feature_result.value is None:\n            record_timing("outcome_and_features", stage_started)\n            record_counter("evaluated_candidate_count", len(evaluations))\n            return Result(\n                feature_result.status,\n                problems=feature_result.problems,\n            )\n        scenario_result = extract_candidate_feature_scenarios(\n            authority,\n            normalized,\n            action.action_id,\n        )\n        record_timing("outcome_and_features", stage_started)\n        if scenario_result.value is None:\n            record_counter("evaluated_candidate_count", len(evaluations))\n            return Result(\n                scenario_result.status,\n                problems=scenario_result.problems,\n            )\n        scenario_features[action.action_id] = scenario_result.value\n        epistemic_input_scenarios += len(scenario_result.value)\n\n        stage_started = perf_counter_ns()\n        try:\n            evaluations.append(\n                score_candidate_features(\n                    feature_result.value,\n                    action.actor_id,\n                    profile,\n                    unit_value_policy,\n                )\n            )\n            scenario_evaluations[action.action_id] = tuple(\n                (\n                    scenario.assignments,\n                    score_candidate_features(\n                        scenario.features,\n                        action.actor_id,\n                        profile,\n                        unit_value_policy,\n                    ),\n                )\n                for scenario in scenario_result.value\n            )\n        finally:\n            record_timing("scoring", stage_started)\n        record_counter("evaluated_candidate_count", len(evaluations))\n\n    record_counter("epistemic_input_scenario_count", epistemic_input_scenarios)\n    stage_started = perf_counter_ns()\n    try:\n        selection = select_candidate_evaluations(\n            tuple(evaluations),\n            profile,\n        )\n        selection, epistemic_scenarios = _apply_epistemic_sensitivity(\n            selection,\n            scenario_features,\n            scenario_evaluations,\n            profile,\n        )\n    finally:\n        record_timing("selection", stage_started)\n    record_counter("epistemic_ranking_scenario_count", len(epistemic_scenarios))\n    assert coverage.value is not None\n    return Result.success(\n        DecisionEvaluation(\n            normalized.state_id,\n            normalized.information_profile.value,\n            MODEL_VERSION,\n            profile.version,\n            profile.fingerprint,\n            unit_value_policy.version,\n            unit_value_policy.fingerprint,\n            coverage.value.manifest_fingerprint,\n            selection.candidates,\n            selection.ranking,\n            selection.chosen_action_id,\n            selection.near_tie_groups,\n            selection.tie_breaks,\n            epistemic_scenarios,\n            selection.information_sensitive,\n        )\n    )\n'''
          evaluator = evaluator[:function_start] + new_function
          evaluator_path.write_text(evaluator, encoding="utf-8")
          PY
      - name: Canonicalize edited Python
        run: python -m ruff format src/bb_agent/features.py src/bb_agent/evaluator.py src/bb_agent/trace.py
      - name: Remove temporary helper
        run: rm .github/workflows/issue22-trace-plumbing.yml
      - name: Commit trace plumbing
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/bb_agent/features.py src/bb_agent/evaluator.py src/bb_agent/trace.py .github/workflows/issue22-trace-plumbing.yml
          git commit -m "Add #22 trace diagnostic plumbing"
          git push origin HEAD:codex/issue-22-decision-trace
