name: Lint fix issue 21

on:
  push:
    branches: [codex/issue-21-evaluator]

permissions:
  contents: write

jobs:
  lint-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-21-evaluator
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - name: Apply pinned Ruff import fix
        run: python -m ruff check --fix src/bb_agent/__init__.py
      - name: Remove temporary lint helper
        run: rm .github/workflows/lint-fix-issue21.yml
      - name: Commit lint fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bb_agent/__init__.py .github/workflows/lint-fix-issue21.yml
          git commit -m "Apply Ruff import fix for #21"
          git push origin HEAD:codex/issue-21-evaluator
