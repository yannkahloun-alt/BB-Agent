name: Issue 27 export Python 3.12

on:
  push:
    branches:
      - codex/issue-27-m1-closure
    paths:
      - .github/workflows/issue27-export-python.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-27-m1-closure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record interpreter
        shell: bash
        run: |
          python --version
          python -c 'import sys; print(sys.executable)'
      - uses: actions/upload-artifact@v4
        with:
          name: bb-agent-python312
          path: /opt/hostedtoolcache/Python/3.12.14/x64
          compression-level: 0
          if-no-files-found: error
      - name: Self-clean exporter
        shell: bash
        run: |
          rm -f .github/workflows/issue27-export-python.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/issue27-export-python.yml
          git commit -m "Clean temporary #27 Python exporter"
          git push origin HEAD:codex/issue-27-m1-closure
