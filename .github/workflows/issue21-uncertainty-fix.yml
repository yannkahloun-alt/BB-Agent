name: Issue 21 uncertainty fix

on:
  push:
    branches: [codex/issue-21-evaluator]
    paths:
      - tools/issue21_uncertainty_fix.py
      - .github/workflows/issue21-uncertainty-fix.yml

permissions:
  contents: write

env:
  PYTHONHASHSEED: "0"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-21-evaluator
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python tools/verify_workflow_dependency.py
      - run: python -m pip install -e ".[dev]"
      - name: Apply uncertainty semantics fix
        run: python tools/issue21_uncertainty_fix.py
      - name: Canonicalize edited Python
        run: |
          python -m ruff format src/bb_agent/features.py src/bb_agent/evaluator.py src/bb_agent/__init__.py tests/test_evaluator.py
          python -m ruff check --fix src/bb_agent/features.py src/bb_agent/evaluator.py src/bb_agent/__init__.py tests/test_evaluator.py
      - name: Remove temporary fixer
        run: rm tools/issue21_uncertainty_fix.py .github/workflows/issue21-uncertainty-fix.yml
      - name: Commit fix generation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix #21 epistemic versus aleatory uncertainty semantics"
          git push origin HEAD:codex/issue-21-evaluator
